name: Nexus API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar Dependências
        run: npm install

  test:
    name: Testes da API
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar Dependências
        run: npm install

      - name: Iniciar API
        run: |
          npm start &
          sleep 10

      - name: Smoke Test
        run: |
          curl --fail http://localhost:3000/api/health

      - name: Encerrar API
        if: always()
        run: |
          pkill node || true

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Simulação de Deploy
        run: |
          echo "Todos os testes foram aprovados."
          echo "Aplicação pronta para implantação."